<h2 mat-dialog-title>{{data.title}}</h2> <br>
<mat-dialog-content>
  <p>{{data.message}}</p>

  @if (data.loading){
    <mat-spinner class="spinner" mode="indeterminate">Loading...</mat-spinner>
  }
</mat-dialog-content>


  <mat-dialog-actions>
    @if (data.title === "Error"){
    <button mat-button matDialogClose>Try again</button>
    }
  </mat-dialog-actions>
