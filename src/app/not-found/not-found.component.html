<mat-card class="not-found-card">
  <mat-card-title>Page Not Found</mat-card-title>
  <mat-card-content>
    <p>Sorry, the page you are looking for does not exist.</p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="goToHome()">
      Go to Home
    </button>
  </mat-card-actions>
</mat-card>
