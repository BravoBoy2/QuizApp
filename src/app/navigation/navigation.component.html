<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="(isHandset$ | async) === false">
    <mat-toolbar>Menu</mat-toolbar>
    @if (!isAdminLoggedIn && !isUserLoggedIn){
    <mat-nav-list>
      <a mat-list-item routerLink="" routerLinkActive="active">Home</a>
      <a mat-list-item routerLink="register">Register</a>
      <a mat-list-item routerLink="login">Login</a>
    </mat-nav-list>
    }
    @if (isUserLoggedIn){
    <mat-nav-list>

        <a mat-list-item routerLink="/user/dashboard" routerLinkActive="active">Dashboard</a>
        <a mat-list-item routerLink="/admin/viewResult">View Result</a>
        <a mat-list-item (click)="logout()">Log out</a>
    </mat-nav-list>
    }

      @if (isAdminLoggedIn) {
      <mat-nav-list>
          <a mat-list-item routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
          <a mat-list-item routerLink="/admin/createQuiz">Create Quiz</a>
          <a mat-list-item routerLink="/admin/viewResult">View Result</a>
          <a mat-list-item (click)="logout()">Log out</a>
      </mat-nav-list>
      }
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (isHandset$ | async) {
        <button
          type="button"
          aria-label="Toggle sidenav"
          mat-icon-button
          (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      <span></span>
    </mat-toolbar>
    <!-- Add Content Here -->

      <router-outlet/>

  </mat-sidenav-content>
</mat-sidenav-container>
